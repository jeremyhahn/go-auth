# automerge: a PR merges itself once CI is green -- unless it asks for review.
#
# Owner rulings, 2026-10-01 (automatethethings#200):
#   "automatically merges the branch to main when there is no code-review
#    label. when a code-review label is present, the automerge does not run.
#    no further action is taken by gitea. i dont want any approvers required
#    for gitea merges to main once the PR CI jobs are all green"
#   "quicbaas is going to be responsible for running the code review agents
#    instead of gitea. we only want standard actions in gitea"
#   "make sure that the automerge squashes and deletes the remote branch"
#
# NO MERGE IS EVER SCHEDULED. Gitea's merge-when-checks-succeed would arm a
# merge that fires the instant CI goes green -- and a `code-review` label added
# while CI runs could only cancel it from a job still waiting for a runner, so
# the labelled PR would merge anyway. Instead this workflow merges IMMEDIATELY,
# and only at a moment it has just checked both conditions:
#   - CI finishing (workflow_run): CI is green now; re-read the labels; merge.
#   - a PR event (opened, push, label change, ready): merge now if CI is
#     already green; otherwise do nothing -- CI finishing will run this again.
# The label is read right before the merge call, so `code-review` added at any
# point before that holds the PR. With the label Gitea does nothing further:
# QuicBaaS reviews the PR. Squash, then delete the head branch.
#
# FAIL CLOSED: nothing merges unless the base branch REQUIRES at least one
# status check and every required context is `success` on the PR head.
#
# The merge is made as the repository's own agent (AGENT_TOKEN), one of the
# principals on the merge whitelist (infra/gitea/scripts/setup-repo-guardrails.sh).
name: Auto Merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_run:
    # The repository's CI workflow; the documentation repos call theirs Docs.
    workflows: [CI, Docs]
    types: [completed]

# One decision per PR (or per head commit for a CI completion) at a time; the
# newest event wins.
concurrency:
  group: automerge-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  merge:
    name: Merge when CI is green and there is no code-review label
    if: >-
      github.server_url != 'https://github.com' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Merge, hold, or wait
        env:
          BOT: ${{ secrets.AGENT_TOKEN }}
          REPO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # A blank token would make Gitea answer as an anonymous caller, which
          # reads as a permissions bug; it must never fall back to another token.
          [ -n "${BOT:-}" ] || {
            echo "::error::AGENT_TOKEN is not set on this repository; the merge is made as the project agent."
            exit 1; }
          api() { # method path [body] -> http code; body in /tmp/api.json
            curl -sS -o /tmp/api.json -w '%{http_code}' -X "$1" \
              -H "Authorization: token $BOT" -H 'Content-Type: application/json' \
              ${3:+-d "$3"} "$REPO_API$2"
          }

          # Which PR. A CI completion names a commit; find the open PR whose
          # head it is (none: a push to main, or the PR moved on -- nothing to do).
          pr="${PR_FROM_EVENT:-}"
          if [ -z "$pr" ]; then
            code=$(api GET "/pulls?state=open&limit=50")
            [ "$code" = "200" ] || { echo "::error::cannot list open PRs (HTTP $code)"; exit 1; }
            pr=$(jq -r --arg s "$RUN_SHA" '[.[] | select(.head.sha == $s)][0].number // empty' /tmp/api.json)
            [ -n "$pr" ] || { echo "no open PR has head $RUN_SHA; nothing to merge"; exit 0; }
          fi

          code=$(api GET "/pulls/$pr")
          [ "$code" = "200" ] || { echo "::error::cannot read PR $pr (HTTP $code)"; exit 1; }
          cp /tmp/api.json /tmp/pr.json
          [ "$(jq -r '.state' /tmp/pr.json)" = "open" ] || { echo "PR $pr is not open"; exit 0; }
          [ "$(jq -r '.draft' /tmp/pr.json)" != "true" ] || { echo "PR $pr is a draft; not merging"; exit 0; }
          head=$(jq -r '.head.sha' /tmp/pr.json)
          base=$(jq -r '.base.ref' /tmp/pr.json)

          # Required checks on the base branch -- fail closed without one.
          code=$(api GET "/branch_protections/$base")
          if [ "$code" != "200" ] || ! jq -e '.enable_status_check == true and ((.status_check_contexts // []) | length > 0)' /tmp/api.json >/dev/null; then
            echo "::error::$base requires no status checks, so nothing would wait for CI. Not merging."
            exit 1
          fi
          jq -c '.status_check_contexts' /tmp/api.json > /tmp/required.json

          # Is every required context green on the PR head?
          code=$(api GET "/commits/$head/statuses?limit=100")
          [ "$code" = "200" ] || { echo "::error::cannot read the statuses of $head (HTTP $code)"; exit 1; }
          # The newest status per context is the one that counts.
          if ! jq -e --slurpfile req /tmp/required.json '
                (sort_by(.id) | reverse | unique_by(.context)) as $latest
                | $req[0] | all(. as $c | any($latest[]; .context == $c and .status == "success"))
              ' /tmp/api.json >/dev/null; then
            echo "CI is not green on $head yet; CI finishing will run this again."
            exit 0
          fi

          # The label decides -- read right before the merge, never from the
          # event payload, so a label added while this job waited still holds.
          code=$(api GET "/issues/$pr/labels")
          [ "$code" = "200" ] || { echo "::error::cannot read the labels of PR $pr (HTTP $code)"; exit 1; }
          if jq -e 'any(.[]; .name == "code-review")' /tmp/api.json >/dev/null; then
            # A schedule armed by the previous automerge.yml must not outlive the
            # label (204 cancelled one; 404 there was none).
            api DELETE "/pulls/$pr/merge" >/dev/null || true
            echo "code-review label: not merging; QuicBaaS reviews PR $pr."
            exit 0
          fi

          # Merge now: squash, delete the head branch, and only if the head is
          # still the commit whose checks were just read.
          body=$(jq -nc --arg h "$head" '{Do: "squash", delete_branch_after_merge: true, head_commit_id: $h}')
          code=$(api POST "/pulls/$pr/merge" "$body")
          case "$code" in
            200|201|204) echo "merged PR $pr ($head) into $base; branch deleted" ;;
            *) echo "::error::PR $pr is green and unlabelled but did not merge (HTTP $code): $(cat /tmp/api.json)"; exit 1 ;;
          esac
