# Integration suites for the external auth backends against real daemons; scheduled and on demand, kept out of the per-push gate because they take minutes.
name: Integration

on:
  schedule:
    - cron: '0 6 * * *'
  # A finished run cannot be re-run through the API.
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'pkg/**'
      - 'test/integration/**'
      - '**/Dockerfile'
      - 'Makefile'
      - '.github/workflows/integration.yml'

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"

jobs:
  integration:
    name: Integration Suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Every suite runs in its own container with its daemon baked in, so this
      # step needs nothing from the host but a Docker daemon (devops.md §4).
      - name: Run integration suites
        run: make integration-test
