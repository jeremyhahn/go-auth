name: CI

# One workflow file, run by both hosts (devops.md §1). Steps that only work on
# github.com are guarded on github.server_url; everything that gates a merge
# runs on Gitea too.
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # Lets a run be repeated without inventing a commit, which matters when a
  # failure is the runner's rather than the code's.
  workflow_dispatch:

# Supersede in-flight CI for a branch when a newer head arrives: the OLDER run
# is cancelled and the newest survives. Measured on this Gitea (1.27.1) rather
# than assumed -- `cancel-in-progress` does NOT evaluate expressions there, so
# any non-empty value is truthy and the literal `true` is what gets written.
#
# The group leads with `github.workflow`, so this `CI` group is disjoint from
# the `Code Review` workflow that also gates merges -- cancelling here
# structurally cannot touch the other required context. A cancelled run does
# write `failure` to its context, but only ever on a superseded SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: '1.27.1'
  # pkg/pam has a //go:build cgo file that needs libpam headers. Building with
  # cgo off keeps every job independent of the runner image's dev packages;
  # the unit-test job is the documented exception (see below).
  CGO_ENABLED: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The ci-runner image bakes golangci-lint, and that copy is the one used.
      # Installing over it swapped the baked binary for whatever this file
      # named at run time (go-auth#26), which is how a stale pin undid the
      # image's Go 1.27 fix. No network fallback on Gitea: an absent or
      # different binary means the image is wrong, and a fallback install would
      # hide exactly that. github.com-hosted runners carry no baked image, so
      # there, and only there, the pinned version is installed.
      - name: Install golangci-lint (github.com only; Gitea uses the baked binary)
        if: github.server_url == 'https://github.com'
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v$(make -s print-golangci-lint-version)"

      # Fails if golangci-lint is absent or not the Makefile's pinned version.
      # Unconditional, on both hosts: test/ci asserts it runs before
      # `make lint` and that no install step reaches a Gitea runner.
      - name: Verify golangci-lint version
        run: make verify-lint-tool

      # `make lint` is gofmt -l, go vet and the golangci-lint umbrella, which
      # is the same command a developer runs (devops.md §4). The security
      # linters staticcheck/errcheck/unused/ineffassign/misspell/gocritic are
      # enabled in .golangci.yml as §8 requires.
      - name: Lint
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all packages
        run: make build

  fips:
    name: FIPS
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    env:
      GOFIPS140: latest
      # fips140=only, not fips140=on: `on` loads the Go Cryptographic Module
      # but still permits MD5 and SHA-1, so this job would report green while
      # a regulated path used a prohibited primitive. `only` makes those
      # operations panic (configuration.md §5).
      GODEBUG: fips140=only
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # One artifact (FIPS boundary ruling 1): the same packages every other
      # job builds, compiled FIPS-capable with GOFIPS140=latest and run with
      # FIPS activated through GODEBUG. There is no FIPS-only build shape.
      # Code whose protocol mandates a non-approved primitive refuses at
      # runtime with a typed ErrFIPSUnsupported instead of panicking: the
      # RADIUS and TACACS+ backends (MD5 — RFC 2865 §3, RFC 8907 §4.5) and
      # the YubiCloud validator (HMAC-SHA-1 — Yubico Validation Protocol
      # 2.0). Their refusal tests run here, so this job proves every backend
      # either works or refuses cleanly under fips140=only; see docs/fips.md.
      - name: Build all packages (FIPS mode)
        run: go build ./...

      - name: Unit tests (FIPS mode)
        run: go test -count=1 -timeout=900s ./...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The race detector requires cgo, and cgo in this module pulls in
      # pkg/pam's //go:build cgo file, which needs libpam headers. This is the
      # one job that turns cgo on, so it is the one job that installs them.
      - name: Install libpam headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpam0g-dev

      - name: Run unit tests with the race detector
        run: make test-race

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: [lint, build]  # v1.9 staged fail-fast: expensive tier gates on the fast tier. Task #90 is narrowly right -- there is no cancel REST route on this Gitea -- which is exactly why supersession is done with the workflow-level `concurrency` block above, not by an API call.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # gosec and govulncheck are baked into the ci-runner image. Installing
      # them here was a network dependency that could fail and leave the job
      # red with no verdict on the code, and @latest scanned one commit with
      # different analysers on different days (go-auth#26). On Gitea the baked
      # binaries are required; github.com-hosted runners have no image, so
      # they install there (devops.md §9: @latest, no pin).
      - name: Install gosec and govulncheck (github.com only; Gitea uses the baked binaries)
        if: github.server_url == 'https://github.com'
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      # The Makefile targets print "not installed, skipping" and exit 0 when a
      # tool is missing, which would turn this job green with nothing scanned,
      # so presence is asserted first. `gosec --version` prints "dev" for any
      # go-installed build; the target logs /etc/ci-runner-tools.txt, the
      # image's record of what it baked, so the log says what actually ran.
      - name: Verify security tools
        run: make verify-security-tools

      # The Makefile carries the flags and the justification for every
      # suppression (devops.md §4/§8). GOSEC_EXTRA only adds the SARIF output
      # uploaded below; gosec still exits non-zero on a finding and gates here.
      # -stdout -verbose text mirrors the findings into the job log: the SARIF
      # upload is github.com-only, so on Gitea a real finding would otherwise
      # produce an exit code and no diagnostics at all (ci-template v1.1).
      - name: Run gosec
        run: make gosec GOSEC_EXTRA="-fmt=sarif -out=gosec.sarif -stdout -verbose text"

      # The code scanning API is github.com-only; anywhere else this 404s. The
      # scan itself has already run and already failed the job on a finding.
      - name: Upload gosec SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

      # govulncheck is also the §9 forcing function for toolchain currency: it
      # fails on a known-vulnerable stdlib, so a stale GO_VERSION breaks here.
      - name: Run govulncheck
        run: make govulncheck

      - name: Verify module integrity
        run: make mod-verify

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    needs: [lint, build]  # v1.9 staged fail-fast: expensive tier gates on the fast tier. Task #90 is narrowly right -- there is no cancel REST route on this Gitea -- which is exactly why supersession is done with the workflow-level `concurrency` block above, not by an API call.
    steps:
      - uses: actions/checkout@v6

      # aquasecurity/trivy-action fetches its install script through a nested
      # checkout that a self-hosted runner resolves against its own server
      # instead of github.com, failing with git exit 128. It is therefore
      # github.com-only, and so is its consumer, the code scanning upload.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: examples

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: examples

      # Gitea and any other non-github.com server run the same gate from the
      # trivy CLI, installed from the upstream release script. Same scanners,
      # same severities, same exit code — the dashboard upload is the only
      # thing GitHub gets and the other host does not.
      - name: Install trivy CLI
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url != 'https://github.com'
        run: make trivy-fs

  # The single required check (devops.md §1). Branch protection requires this
  # job and nothing else; adding a job above means adding it to `needs` and to
  # the results list below.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, build, fips, test, security, trivy]
    steps:
      # join(needs.*.result) is a GitHub extension that evaluates to an empty
      # string on Gitea, so a gate built on it reports success while jobs are
      # failing. Every job is listed by name, and a result that cannot be read
      # at all is treated as a failure rather than a pass.
      - name: Check job results
        env:
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
          FIPS: ${{ needs.fips.result }}
          TEST: ${{ needs.test.result }}
          SECURITY: ${{ needs.security.result }}
          TRIVY: ${{ needs.trivy.result }}
        run: |
          failed=0
          for job in LINT BUILD FIPS TEST SECURITY TRIVY; do
            eval "result=\$$job"
            echo "${job}=${result:-<unreadable>}"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "CI gate failed: not every job reported success."
            exit 1
          fi
          echo "CI gate passed."
