# golangci-lint configuration; part of the security gate (staticcheck covers gosimple in v2).
version: "2"

run:
  timeout: 5m
  # Tests are analysed so `unused` does not flag test-only helpers; noisy linters are relaxed on _test.go below.
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck # includes the former gosimple (S1xxx) checks
    - unused
    - ineffassign
    - misspell
    - gocritic

  settings:
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        # QF1008: naming the embedded field says which part of the RADIUS packet is mutated; style-only check.
        - -QF1008
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # Would require changing exported signatures across every backend.
        - hugeParam
        - rangeValCopy

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests discard setup errors, pass nil contexts (SA1012) and keep unread fields on purpose; the library is linted in full.
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - staticcheck
          - unused
      # defaultSessionOpener's only user is in the cgo-only pam_default_cgo.go, invisible to a CGO_ENABLED=0 lint run.
      - path: pkg/pam/auth\.go
        linters:
          - unused
        text: defaultSessionOpener
    paths:
      # Examples are //go:build ignore documentation snippets, compiled by
      # hand rather than by the module build.
      - examples
      - third_party$
      - builtin$

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - examples
      - third_party$
      - builtin$
